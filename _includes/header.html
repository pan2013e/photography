<title>{{ site.title }}</title>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
<link rel="stylesheet" href="{{ '/assets/css/main.min.css' | relative_url }}"/>
<link rel="stylesheet" href="{{ '/assets/css/globe.css' | relative_url }}?v={{ site.time | date: '%s' }}"/>
{% if page.layout == 'story' or page.layout == 'stories' %}
<link rel="stylesheet" href="{{ '/assets/css/story.css' | relative_url }}?v={{ site.time | date: '%s' }}"/>
{% endif %}
<style>
body { margin: 0; }
html.is-iframe #header nav > ul > li.hide-in-iframe { display: none; }
</style>
<script>
(function () {
    var isEmbedded = false;

    try {
        isEmbedded = window.self !== window.top;
    } catch (error) {
        isEmbedded = true;
    }

    if (isEmbedded) {
        document.documentElement.classList.add('is-iframe');
    }
})();
</script>
