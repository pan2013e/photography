name: Build and deploy

# The site is built by Jekyll here rather than by the GitHub Pages service,
# because _plugins/atlas.rb derives the galleries from the photographs and the
# service does not run plugins.
#
# One-time setting: Settings -> Pages -> Build and deployment -> Source must be
# "GitHub Actions", not "Deploy from a branch".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/configure-pages@v5

      # main.min.css and site.min.js are committed, but building them here
      # means a stale commit cannot ship.
      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
