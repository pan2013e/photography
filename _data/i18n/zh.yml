# 界面文本，简体中文。
#
# 键名必须与 _data/i18n/en.yml 完全一致；缺少的键会回退到英文，
# 所以未译完的文件也能正常渲染，只是那几处仍是英文。
#
# 语气：与英文版一致，克制、平实的书面语。功能性的标签（搜索、错误提示、
# 无障碍标签）用规范说法，不用口语；只有正文一类的句子可以松一点。
#
# `js` 是唯一送进浏览器的部分：_includes/header.html 把它写成
# window.SiteText，脚本从那里读取。花括号是脚本填入的占位符。

