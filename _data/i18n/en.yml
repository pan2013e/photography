# Interface text, English.
#
# Every locale file has the same keys. A key missing from a translation falls
# back to this file, so a half-finished translation still renders -- it just
# renders partly in English.
#
# `js` is the only part the browser sees: _includes/header.html writes it into
# the page as window.SiteText, and the scripts read it from there. Braces are
# placeholders filled in by the script, e.g. "{count} photographs".
#
# See _plugins/i18n.rb for how locales are put together, and
# _reference/*.<code>.csv for the names of places.

label: English
short: EN

site:
  title: Photography by Zhiyuan Pan
  description: See the world through my eyes!

date:
  # Liquid `date:` formats. Only used where the site writes a date itself; a
  # date typed into a story's front matter is printed as typed.
  month_year: "%B %Y"
  day_month_year: "%b %-d, %Y"
  postcard: "%-d %B %Y"

